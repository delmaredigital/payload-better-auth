name: Publish to npm

on:
  push:
    tags:
      - 'v*'

permissions:
  id-token: write
  contents: write

jobs:
  # Hard gate: a tag publishes nothing unless the full CI matrix passes on the
  # exact commit the tag points at. Reuses .github/workflows/ci.yml so the
  # release checks can never drift from the pull-request checks.
  ci:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: ci
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4

      # Everything that can fail runs BEFORE `npm publish` — that step is the
      # point of no return, since a published version number can never be
      # reused. Failing here costs only `git tag -d` and a re-tag. The GitHub
      # release created afterwards is freely editable, so validating its
      # inputs up front is free insurance.
      - name: Validate release
        run: |
          VERSION="$(node -p "require('./package.json').version")"

          # A hand-cut tag that doesn't match package.json would publish the
          # wrong version under the right tag name — silent and unfixable.
          if [ "$TAG" != "v$VERSION" ]; then
            echo "::error::Tag $TAG does not match package.json version $VERSION."
            exit 1
          fi

          # Release notes: this version's CHANGELOG prose. `--notes-file` is
          # PREPENDED to `--generate-notes`, so the release reads as the
          # hand-written "what changed and why", then GitHub's auto-generated
          # "What's Changed" / "New Contributors" — the latter is what credits
          # contributors by @handle and PR number, kept automatic.
          awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" {flag=1; next}
            flag && /^## \[/ {exit}
            flag {print}
          ' CHANGELOG.md > release-notes.md

          # Fail closed: a missing section means the CHANGELOG step was skipped.
          # Better to catch that now than to publish and notice afterwards.
          if [ ! -s release-notes.md ]; then
            echo "::error::No CHANGELOG section found for [$VERSION]. Add one before tagging."
            exit 1
          fi

          echo "Release notes for $VERSION ($(wc -l < release-notes.md) lines):"
          cat release-notes.md

          # npm dist-tag. A prerelease (e.g. 0.14.0-next.0, the Payload 4 line)
          # must never become `latest`, or every Payload 3 install would pull
          # it. Prereleases publish under their identifier (`next`, `beta`, …);
          # only plain x.y.z versions publish as `latest`.
          if [[ "$VERSION" == *-* ]]; then
            PRE="${VERSION#*-}"
            DIST_TAG="${PRE%%.*}"
            if ! [[ "$DIST_TAG" =~ ^[a-z][a-z0-9-]*$ ]] || [ "$DIST_TAG" = "latest" ]; then
              echo "::error::Prerelease $VERSION has no usable dist-tag identifier (got '$DIST_TAG'). Use e.g. ${VERSION%%-*}-next.0."
              exit 1
            fi
            echo "PRERELEASE=true" >> "$GITHUB_ENV"
          else
            DIST_TAG=latest
            echo "PRERELEASE=false" >> "$GITHUB_ENV"
          fi
          echo "DIST_TAG=$DIST_TAG" >> "$GITHUB_ENV"
          echo "Publishing $VERSION under dist-tag '$DIST_TAG'"
        env:
          TAG: ${{ github.ref_name }}

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - run: pnpm install --frozen-lockfile

      # Tests and typecheck already ran in the `ci` job above, on this commit.
      - run: pnpm build

      # ─── point of no return: everything below is irreversible ───
      - run: npm publish --access public --tag "$DIST_TAG"

      - name: Create GitHub Release
        run: |
          FLAGS=()
          if [ "$PRERELEASE" = "true" ]; then FLAGS+=(--prerelease); fi
          gh release create "$TAG" --notes-file release-notes.md --generate-notes "${FLAGS[@]}"
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
